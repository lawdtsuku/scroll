<!doctype html><html><head><meta charset="utf-8"><title>Scroll isolated browser checks</title><style>body{font:18px system-ui;max-width:760px;margin:3rem auto;padding:1rem}button{font:inherit;padding:1rem}label{display:block;padding:1rem}pre{white-space:pre-wrap}</style></head><body><h1>Isolated storage verification</h1><p>Uses a separate temporary database. No campaign data is read or edited.</p><label><input id="protected-confirm" type="checkbox"> Approve the synthetic protected test changes</label><button id="confirm-save">Run browser checks</button><pre id="result">Ready</pre><script type="module">
import {newCampaign,prepareCreation,preview,summary,clone} from './core.js';
import {previewUpdate} from './updates.js';
import {openDB,commit,getCampaign} from './db.js';
import {authorizeUpdateReview} from './operation-policy.js';
import {dayToken,safeDisplay} from './progress.js';
const dbName='scroll-consolidated-qa-'+crypto.randomUUID();let state,pass=0;const result=document.querySelector('#result');const check=(v,msg)=>{if(!v)throw Error(msg);pass++;};const envelope=(ops,id=crypto.randomUUID())=>({format:'scroll-session-update',version:1,campaign_id:state.campaign_id,lineage_id:state.lineage_id,base_revision:state.current_revision,update_id:id,operations:ops});let protectedPreview,forgedPreview;
document.querySelector('#confirm-save').onclick=async event=>{try{if(forgedPreview){authorizeUpdateReview(forgedPreview,event);forgedPreview.next.characters[0].resources[0].max=500;let rejected=false;try{await commit(forgedPreview);}catch{rejected=true;}check(rejected,'Changed preview committed');result.textContent='PASS: '+pass+' browser storage and approval checks.';document.querySelector('#confirm-save').disabled=true;return;}if(!state){await openDB(dbName);state=prepareCreation(newCampaign({display_name:'Synthetic QA',resources:[{id:'health',label:'Health'}]}),'Test setup').next;await commit({campaign_id:state.campaign_id,base_revision:0,lineage_id:state.lineage_id,next:state},true);const op={op:'schedule_event',character_id:state.characters[0].character_id,reason:'created',visibility:'dm_only',eligible_from_day:17,must_fire_by_day:17,selection_rule:'first_day'};protectedPreview=previewUpdate(state,envelope([op]));let rejected=false;try{await commit(protectedPreview);}catch{rejected=true;}check(rejected,'Protected commit must reject without review');result.textContent='Protection gate passed. Tick the approval checkbox and click again to test an authorized commit.';return;}
if(protectedPreview){authorizeUpdateReview(protectedPreview,event);state=await commit(protectedPreview);protectedPreview=null;check(state.scheduler.events.length===1,'Protected event did not save');check(!summary(state).includes('fires_on_day'),'Summary revealed schedule field');check(!JSON.stringify(safeDisplay(state)).includes('fires_on_day'),'Projection revealed schedule field');result.textContent='Protected save passed. Click once more to test import commit, stale writes, persistence and preview binding.';return;}
const before=state.current_revision;const op={op:'set_resource_max',character_id:state.characters[0].character_id,reason:'Test',resource:'health',value:9};const first=previewUpdate(state,envelope([op]));authorizeUpdateReview(first,event);state=await commit(first);check(state.current_revision===before+1,'Revision not advanced');check((await getCampaign(state.campaign_id)).characters[0].resources[0].max===9,'Persistence failed');check(dayToken(state)===dayToken(await getCampaign(state.campaign_id)),'Token changed on reload');let rejected=false;try{await commit(first);}catch{rejected=true;}check(rejected,'Review token reused');const stale=preview(state,[{op:'adjust_currency',character_id:state.characters[0].character_id,delta:1,reason:'Test'}],'Test');state=await commit(preview(state,[{op:'adjust_currency',character_id:state.characters[0].character_id,delta:2,reason:'Other tab'}],'Other tab'));rejected=false;try{await commit(stale);}catch{rejected=true;}check(rejected,'Stale transaction committed');forgedPreview=previewUpdate(state,envelope([{...op,value:10}]));result.textContent='Persistence and stale-write checks passed. Click once more to verify changed-preview rejection.';
}catch(e){result.textContent='FAIL: '+e.message;}};
</script></body></html>
