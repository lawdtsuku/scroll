<!doctype html><meta charset="utf-8"><title>Snapshot storage checks</title><button id="run">Run isolated snapshot storage checks</button><pre id="result"></pre><script type="module">
import {loadSnapshot,replaceSnapshot} from '/snapshot-store.js';
const check=(x,m)=>{if(!x)throw Error(m);};
async function recordState(){const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('scroll',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});try{return await new Promise((resolve,reject)=>{const tx=db.transaction('campaigns','readonly'),r=tx.objectStore('campaigns').getAll();r.onsuccess=()=>resolve(JSON.stringify(r.result));r.onerror=()=>reject(r.error);});}finally{db.close();}}
document.querySelector('#run').onclick=async()=>{try{const before=await recordState(),original=await loadSnapshot();check(original,'Load a synthetic snapshot first.');const incoming=structuredClone(original);incoming.exported_at='1999-01-01T00:00:00.000Z';incoming.inventory[0].qty=8;await replaceSnapshot(incoming);check((await loadSnapshot()).inventory[0].qty===8,'Replacement failed');let rejected=false;try{await replaceSnapshot({...incoming,journal:[]});}catch{rejected=true;}check(rejected,'Unexpected campaign data accepted');check((await loadSnapshot()).inventory[0].qty===8,'Invalid input replaced valid data');check(before===await recordState(),'Snapshot wrote to campaign storage');await replaceSnapshot(original);document.querySelector('#result').textContent='PASS: replacement ignores timestamp; invalid input retains previous snapshot; campaign database byte-for-byte unchanged; original synthetic snapshot restored.';}catch(e){document.querySelector('#result').textContent='FAIL: '+e.message;}};
</script>
